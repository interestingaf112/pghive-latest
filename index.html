<!doctype html>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>PGhive | Premium Paying Guest Accommodations in Bangalore</title>
  </head>
  <body>
    <noscript>
      <div class="noscript-fallback-wrapper">
        <header class="navbar-noscript">
          <span class="logo-noscript">PGhive</span>
        </header>
        <div class="noscript-hero">
          <h1>Zero Brokerage — Contact Owners Directly</h1>
          <p>Please enable JavaScript in your browser settings to explore rooms, list your properties for free, and unlock verified owner contact details.</p>
        </div>
        <div class="noscript-hubs-title">Explore Bangalore's co-living hubs:</div>
        <div class="noscript-hubs-grid">
          <div class="noscript-hub-card">
            <h4>SG Palya</h4>
            <p>Christ University co-living spaces</p>
          </div>
          <div class="noscript-hub-card">
            <h4>Koramangala</h4>
            <p>Tech parks & startup startup cafés</p>
          </div>
          <div class="noscript-hub-card">
            <h4>HSR Layout</h4>
            <p>Startup hub & co-working parks</p>
          </div>
          <div class="noscript-hub-card">
            <h4>BTM Layout</h4>
            <p>Budget rooms & transit hubs</p>
          </div>
          <div class="noscript-hub-card">
            <h4>Marathahalli</h4>
            <p>Outer Ring Road IT tech parks</p>
          </div>
        </div>
        <div class="noscript-footer">
          &copy; 2026 PGhive. Premium co-living listings in Bangalore.
        </div>
      </div>
      <style>
        .noscript-fallback-wrapper {
          max-width: 800px;
          margin: 0 auto;
          padding: 24px;
          font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
          color: #09090b;
        }
        .navbar-noscript {
          padding: 16px 0;
          border-bottom: 1.5px solid #09090b;
        }
        .logo-noscript {
          font-family: 'Outfit', sans-serif;
          font-size: 21px;
          font-weight: 900;
        }
        .noscript-hero {
          margin: 64px 0 48px;
          text-align: center;
        }
        .noscript-hero h1 {
          font-family: 'Outfit', sans-serif;
          font-size: 32px;
          font-weight: 800;
          letter-spacing: -0.8px;
        }
        .noscript-hero p {
          color: #71717a;
          margin-top: 16px;
          font-size: 15px;
          line-height: 1.6;
        }
        .noscript-hubs-title {
          font-weight: 700;
          font-size: 16px;
          margin-bottom: 16px;
          text-align: left;
        }
        .noscript-hubs-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
          margin-bottom: 64px;
        }
        .noscript-hub-card {
          border: 1.5px solid #09090b;
          border-radius: 4px;
          padding: 16px;
          box-shadow: 4px 4px 0px #eaddd3;
          text-align: left;
        }
        .noscript-hub-card h4 {
          font-family: 'Outfit', sans-serif;
          font-size: 18px;
          font-weight: 700;
          margin: 0 0 6px 0;
        }
        .noscript-hub-card p {
          font-size: 13px;
          color: #71717a;
          margin: 0;
        }
        .noscript-footer {
          border-top: 1px solid #e4e4e7;
          padding-top: 24px;
          text-align: center;
          font-size: 13px;
          color: #71717a;
        }
      </style>
    </noscript>
    
    <div id="root">
      <!-- Instant Premium Brand Loader -->
      <style>
        .initial-loader-wrapper {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #ffffff;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
          z-index: 99999;
        }
        .initial-loader-logo {
          font-size: 40px;
          letter-spacing: -1px;
          line-height: 1;
          display: flex;
          align-items: center;
          margin-bottom: 24px;
          user-select: none;
        }
        .initial-loader-logo .pg {
          font-weight: 800;
          color: #111111;
        }
        .initial-loader-logo .hive {
          font-weight: 800;
          color: #0035ad;
        }
        .initial-loader-spinner-container {
          position: relative;
          width: 48px;
          height: 48px;
        }
        .initial-loader-circle {
          box-sizing: border-box;
          width: 100%;
          height: 100%;
          border: 3.5px solid rgba(0, 53, 173, 0.08);
          border-radius: 50%;
          border-top-color: #0035ad;
          animation: initial-spin 0.8s cubic-bezier(0.6, 0.2, 0.1, 1) infinite;
        }
        .initial-loader-pulse {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 3.5px solid #0035ad;
          border-radius: 50%;
          opacity: 0;
          animation: initial-pulse-scale 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
        @keyframes initial-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes initial-pulse-scale {
          0% { transform: scale(0.8); opacity: 0.5; }
          100% { transform: scale(1.6); opacity: 0; }
        }
      </style>
      <div class="initial-loader-wrapper">
        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <img src="/logo-cropped.png" alt="PGhive Logo" style="height: 64px; display: block;" />
        </div>
        <div class="initial-loader-spinner-container">
          <div class="initial-loader-circle"></div>
          <div class="initial-loader-pulse"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
